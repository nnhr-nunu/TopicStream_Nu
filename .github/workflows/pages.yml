name: pages-build

on:
  push:
    branches: [main, cursor/topicstream-nu-app-d395]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      # 本番（Vercel）と同じ通常ビルド。キー無しでも通る
      - run: npm run build
      - run: bash scripts/build-pages.sh
        env:
          PAGES_BASE_PATH: /TopicStream_Nu
          NEXT_PUBLIC_BASE_PATH: /TopicStream_Nu
      - run: test -f out/index.html
